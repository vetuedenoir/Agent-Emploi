<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Agent emploi{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Agent emploi</a>
    <nav>
      <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Tableau de bord</a>
      <a href="/offres" {% if request.url.path.startswith('/offres') %}aria-current="page"{% endif %}>Offres</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
