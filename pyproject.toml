[project]
name = "agent-emploi"
version = "0.1.0"
description = "Système multi-agents de recherche et de candidature à des offres d'emploi"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_emploi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: touche le réseau réel (désactivé par défaut)",
]
addopts = "-m 'not live'"
