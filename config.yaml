# Configuration d'Agent-Emploi.
# Les secrets ne sont PAS ici : ils sont lus dans l'environnement (voir .env.example).

profile:
  cv_markdown: profile/cv.md
  cv_fr: profile/cv_fr.pdf
  cv_en: profile/cv_en.pdf
  voice: profile/voice.md
  banned_phrases: profile/banned_phrases.txt

paths:
  data: data
  outbox: outbox
  applications: applications

search:
  # Sources interrogées, dans l'ordre. `france_travail` demande deux
  # identifiants (voir .env.example) ; sans eux, elle est ignorée avec un
  # avertissement et la passe continue sur les autres.
  sources: ["wttj", "france_travail"]
  # Requêtes envoyées aux sources. Une passe par requête.
  queries:
    - "ingénieur IA"
    - "machine learning engineer"
    - "data scientist"
    - "LLM engineer"
    # Le CV vise un stage de 6 mois : les requêtes génériques ci-dessus
    # remontent surtout des CDI, que le fit-check écarte sur le contrat.
    # Celles-ci vont chercher directement les offres du bon format.
    - "stage machine learning"
    - "stage data scientist"
    - "alternance intelligence artificielle"
  # Pays tels que nommés par la source (facette `offices.country` chez WTTJ).
  countries: ["France"]
  # Contrats : CDI, CDD, stage, alternance, freelance.
  # Le CV vise un stage de 6 mois : une offre en CDI est écartée par le
  # fit-check sur le contrat, après avoir coûté un appel LLM. Les retirer
  # d'ici rend ce budget aux offres du bon format.
  contracts: ["stage", "alternance"]
  # Politique de télétravail. Laisser vide pour ne pas filtrer.
  # Valeurs WTTJ observées : full, partial, punctual, no, unknown.
  remote: []
  max_age_days: 30
  # Nombre d'offres DISTINCTES visées par requête et par source. La source
  # sur-échantillonne : chez WTTJ une même offre est indexée une fois par job
  # board partenaire qui la diffuse.
  per_query_limit: 40

filters:
  # Au moins un de ces termes doit apparaître dans le titre ou la description.
  # Les termes de 4 caractères ou moins sont traités comme des sigles : ils sont
  # cherchés sur des limites de mot, pas en sous-chaîne. « AI » attrape donc
  # « AI Engineer » sans attraper « Financial ».
  required_any:
    - "IA"
    - "AI"
    - "ML"
    - "MLOps"
    - "GenAI"
    - "intelligence artificielle"
    - "machine learning"
    - "deep learning"
    - "LLM"
    - "NLP"
    - "computer vision"
    - "vision par ordinateur"
    - "data scien"
    - "Agent"
  # Élimination immédiate si présent dans le titre.
  excluded_any:
    - "stage de fin d'études non rémunéré"
    - "commercial"
    - "business developer"
  # Si vrai, un terme de `required_any` doit déjà figurer dans le TITRE : l'offre
  # est écartée sans même la requête de détail. Passer à false élargit la pêche
  # au prix d'une requête HTTP par offre remontée.
  require_in_title: true
  # Score lexical CV <-> offre, en dessous duquel on n'appelle pas le LLM.
  # Cosinus sur vecteurs log-TF : mesuré sur ce CV, une offre franchement hors
  # sujet tombe à 0.00-0.02, une offre pertinente se situe vers 0.06-0.12. Les
  # descriptions longues diluent le score : mieux vaut un seuil bas et laisser
  # le fit-check trancher. Relever le seuil réduit le nombre d'appels LLM.
  min_lexical_score: 0.04
  # Une offre de la même entreprise + même titre revue sous ce délai est un doublon.
  dedup_window_days: 60

gate:
  # Porte Jev (jevmodel.org), entre le pré-filtrage et le fit-check : un appel
  # à ~0,0001 $ par offre, qui écarte avant le LLM les offres dont l'expérience
  # exigée ou le contrat sont bloquants. Clé : JEVMODEL_API_KEY. Sans clé, ou
  # crédits épuisés, la porte se retire et le fit-check tranche seul.
  # Laisser à false jusqu'à `calibrate-gate`, qui mesure les seuils ci-dessous
  # sur les offres déjà notées par le fit-check.
  enabled: true
  # Adéquation minimale sur l'échelle Jev : 0 hors périmètre, 1 partielle,
  # 2 défendable, 3 forte.
  min_score: 1.0
  # Probabilité au-delà de laquelle l'expérience exigée est jugée bloquante.
  max_blocking: 0.7
  # Probabilité en deçà de laquelle le contrat est jugé hors de search.contracts.
  min_contract: 0.3

fit:
  # Score minimal du verdict LLM pour passer à la rédaction.
  min_score: 65
  # `maybe` est accepté, mais seulement au-dessus du score : mesuré sur les 95
  # premiers verdicts, `apply` ne sort jamais en dessous de 70 et `maybe` monte
  # jusqu'à 75. Refuser tous les `maybe` écartait 4 offres notées 65+ pour la
  # seule étiquette — c'est le score qui tranche.
  accept_verdicts: ["apply", "maybe"]

letter:
  min_words: 150
  max_words: 250
  # Nombre de régénérations autorisées si une formule interdite est détectée.
  max_regenerations: 1
  # Lettres rédigées par passe (`draft`, `run`), la seule étape payante.
  max_per_day: 5

llm:
  # Association tâche -> modèle. `tier` sert uniquement de repère de lecture.
  # Repli Gemini : `gemini-3.5-flash-lite`, pas `gemini-3.5-flash`. Au tier
  # gratuit, flash répond 503 (« high demand ») ou 429 dès qu'il prend le relais
  # en rafale — 50 échecs pour 130 réussites dans llm_usage.jsonl. La version
  # lite a répondu 24 fois sur 24 au banc d'essai du 27/09. Elle trie moins
  # finement : sur 16 offres, 3 ont changé de côté de `fit.min_score` par
  # rapport à gpt-oss, toutes vers le refus. Un repli prudent vaut mieux qu'un
  # repli qui ne répond pas.
  tasks:
    fit_check:
      tier: free
      provider: groq
      model: openai/gpt-oss-120b
      fallback: { provider: gemini, model: gemini-3.5-flash-lite }
    letter:
      tier: paid
      provider: anthropic
      model: claude-opus-5
    review:
      tier: free
      provider: groq
      model: openai/gpt-oss-120b
      fallback: { provider: gemini, model: gemini-3.5-flash-lite }

  # Tarifs en dollars par million de tokens, pour l'estimation de coût.
  # Les tiers gratuits sont à 0 ; ajuster si un quota devient payant.
  pricing:
    "claude-opus-5": { input: 5.0, output: 25.0 }
    "openai/gpt-oss-120b": { input: 0.0, output: 0.0 }
    "gemini-3.5-flash-lite": { input: 0.0, output: 0.0 }
    # Porte Jev : seule l'entrée est facturée.
    "jev-latest": { input: 0.042, output: 0.0 }

budget:
  # Plafond de dépense estimée par jour, en dollars. La boucle s'arrête
  # proprement une fois atteint.
  daily_usd: 1.0
  # Nombre maximal d'appels LLM par jour, toutes tâches confondues.
  daily_calls: 500
